services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel-ai-webshop
        working_dir: /app
        ports:
            - "8000:8000"
        volumes:
            - .:/app
            - vendor:/app/vendor
        depends_on:
            - db
        networks:
            - laravel-ai-webshop

    db:
        image: postgres:16
        container_name: laravel-ai-webshop-postgres-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: laravel
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: secret
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - laravel-ai-webshop

volumes:
    postgres-data:
    vendor:

networks:
    laravel-ai-webshop:
        driver: bridge
